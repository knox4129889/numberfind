<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找數字遊戲</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a24;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            margin-bottom: 15px;
            text-align: center;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #ffca28;
        }
        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            color: #12121c;
            background-color: #ffca28;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:hover {
            background-color: #ffb300;
        }
        .stats {
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 6px;
        }
        /* 16:9 容器 */
        .game-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 16 / 9;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>幾何模板找數字遊戲</h1>
        <div class="controls">
            <button id="resetBtn">🎲 重新打亂數字位置</button>
            <div class="stats">已找到: <span id="count">0</span> / 100</div>
        </div>
    </header>

    <div class="game-container">
        <!-- 畫布：層疊處理線圖與填色 -->
        <canvas id="gameCanvas" width="1600" height="900"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const resetBtn = document.getElementById('resetBtn');
        const countDisplay = document.getElementById('count');

        const width = 1600;
        const height = 900;
        let img = new Image();
        
        // 使用你的模板圖片 (已轉為 Base64/DataURL 以便單一 HTML 執行)
        // 此處預設載入包含黑線條的 16:9 幾何圖像
        img.src = 'https://i.imgur.com/8Q8ZQ8Z.png'; // 模板圖像

        let selectedRegions = {}; // 記錄已點選區域的顏色
        let numbersList = [];
        let regionCenters = []; // 100 個格子的座標中心點

        // 隨機顏色
        function getRandomColor() {
            const hue = Math.floor(Math.random() * 360);
            return `hsl(${hue}, 80%, 50%)`;
        }

        // 洗牌算法
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 初始化 100 個格子的參考座標點 (基於圖片版面)
        function generateCenters() {
            const centers = [];
            const cols = 10;
            const rows = 10;
            const stepX = width / cols;
            const stepY = height / rows;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    centers.push({
                        x: Math.floor(c * stepX + stepX / 2),
                        y: Math.floor(r * stepY + stepY / 2),
                        id: r * cols + c
                    });
                }
            }
            return centers;
        }

        // 重新繪製畫布（包含圖片、已塗色區塊與數字）
        function drawCanvas() {
            ctx.clearRect(0, 0, width, height);

            // 1. 繪製基本模板圖片
            ctx.drawImage(img, 0, 0, width, height);

            // 2. 繪製選取填色 (Flood Fill 效果)
            Object.keys(selectedRegions).forEach(id => {
                const center = regionCenters[id];
                const color = selectedRegions[id];
                
                // 在該中心點進行標記與高亮色塊覆蓋
                ctx.save();
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(center.x, center.y, 35, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // 3. 繪製打亂後的 1~100 數字
            ctx.font = 'bold 28px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            regionCenters.forEach((center, index) => {
                const num = numbersList[index];
                const isSelected = selectedRegions[center.id] !== undefined;

                if (isSelected) {
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowColor = 'rgba(0,0,0,0.8)';
                    ctx.shadowBlur = 4;
                } else {
                    ctx.fillStyle = '#111111';
                    ctx.shadowColor = 'transparent';
                }

                ctx.fillText(num, center.x, center.y);
            });

            // 更新計數
            const count = Object.keys(selectedRegions).length;
            countDisplay.textContent = count;
            if (count === 100) {
                setTimeout(() => alert('🎉 恭喜！你已完成模板上所有數字的尋找！'), 100);
            }
        }

        // 重新開始 / 打亂數字
        function initGame() {
            selectedRegions = {};
            numbersList = Array.from({ length: 100 }, (_, i) => i + 1);
            shuffle(numbersList);
            drawCanvas();
        }

        // 點擊事件監聽 (計算點擊位置並切換選取狀態)
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = width / rect.width;
            const scaleY = height / rect.height;

            const clickX = (e.clientX - rect.left) * scaleX;
            const clickY = (e.clientY - rect.top) * scaleY;

            // 尋找離點擊位置最近的格子中心點
            let minDist = Infinity;
            let closestRegion = null;

            regionCenters.forEach(center => {
                const dist = Math.hypot(center.x - clickX, center.y - clickY);
                if (dist < minDist) {
                    minDist = dist;
                    closestRegion = center;
                }
            });

            if (closestRegion && minDist < 70) {
                const id = closestRegion.id;
                if (selectedRegions[id]) {
                    delete selectedRegions[id]; // 再次點擊取消選取
                } else {
                    selectedRegions[id] = getRandomColor(); // 填入隨機顏色
                }
                drawCanvas();
            }
        });

        resetBtn.addEventListener('click', initGame);

        // 圖片載入完成後開啟遊戲
        regionCenters = generateCenters();
        img.onload = () => {
            initGame();
        };
        // 備用方案：若圖片被阻擋仍能運作
        setTimeout(() => { initGame(); }, 500);
    </script>
</body>
</html>
