<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16:9 幾何拼圖找數字遊戲</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            margin-bottom: 15px;
            text-align: center;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #4da6ff;
        }
        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }
        button {
            padding: 8px 18px;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            background-color: #4da6ff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #3385ff;
        }
        button:active {
            transform: scale(0.98);
        }
        .stats {
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 6px;
        }
        /* 16:9 容器構建 */
        .game-wrapper {
            width: 100%;
            max-width: 1000px; /* 控制最大寬度 */
            aspect-ratio: 16 / 9; /* 鎖定 16:9 比例 */
            position: relative;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        svg {
            width: 100%;
            height: 100%;
            display: block;
            user-select: none;
        }
        .cell {
            cursor: pointer;
            stroke: #2c3e50;
            stroke-width: 1.5;
            transition: fill 0.25s ease, opacity 0.2s;
        }
        .cell:hover {
            opacity: 0.85;
        }
        .cell-text {
            font-size: 13px;
            font-weight: bold;
            fill: #2c3e50;
            pointer-events: none; /* 讓點擊穿透文字直接點到格子 */
            text-anchor: middle;
            dominant-baseline: central;
        }
        .selected-text {
            fill: #ffffff !important;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <header>
        <h1>16:9 幾何拼圖找數字遊戲</h1>
        <div class="controls">
            <button id="resetBtn">重新開始 (新版面)</button>
            <div class="stats">已選擇: <span id="count">0</span> / 100</div>
        </div>
    </header>

    <!-- 16:9 響應式遊戲區域 -->
    <div class="game-wrapper">
        <svg id="gameSvg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet"></svg>
    </div>

    <script>
        const svg = document.getElementById('gameSvg');
        const resetBtn = document.getElementById('resetBtn');
        const countDisplay = document.getElementById('count');
        
        let selectedCount = 0;

        // 生成隨機飽和顏色 (色彩鮮艷且清晰)
        function getRandomColor() {
            const hue = Math.floor(Math.random() * 360);
            return `hsl(${hue}, 70%, 50%)`;
        }

        // 洗牌算法 (Fisher-Yates)
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 生成 100 個幾何區域的切割演算法
        function generateRegions() {
            // 基礎網格 (10x10 = 100 個基本單元)
            const rows = 10;
            const cols = 10;
            const width = 1600;
            const height = 900;
            const cellW = width / cols;
            const cellH = height / rows;

            const regions = [];

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const x = c * cellW;
                    const y = r * cellH;
                    
                    // 隨機選擇形狀種類：0: 矩形, 1: 三角形, 2: 圓弧/半圓形
                    const shapeType = Math.floor(Math.random() * 3);
                    let pathD = '';
                    let centerX = x + cellW / 2;
                    let centerY = y + cellH / 2;

                    if (shapeType === 0) {
                        // 方形/矩形 (略帶圓角或微微傾斜)
                        pathD = `M ${x} ${y} L ${x + cellW} ${y} L ${x + cellW} ${y + cellH} L ${x} ${y + cellH} Z`;
                    } else if (shapeType === 1) {
                        // 三角形/切角塊 (對角線切分風格)
                        const corner = Math.floor(Math.random() * 4);
                        if (corner === 0) {
                            pathD = `M ${x} ${y} L ${x + cellW} ${y} L ${x} ${y + cellH} Z`;
                            centerX = x + cellW / 3;
                            centerY = y + cellH / 3;
                        } else if (corner === 1) {
                            pathD = `M ${x + cellW} ${y} L ${x + cellW} ${y + cellH} L ${x} ${y} Z`;
                            centerX = x + (cellW * 2) / 3;
                            centerY = y + cellH / 3;
                        } else if (corner === 2) {
                            pathD = `M ${x} ${y} L ${x + cellW} ${y + cellH} L ${x} ${y + cellH} Z`;
                            centerX = x + cellW / 3;
                            centerY = y + (cellH * 2) / 3;
                        } else {
                            pathD = `M ${x + cellW} ${y} L ${x + cellW} ${y + cellH} L ${x} ${y + cellH} Z`;
                            centerX = x + (cellW * 2) / 3;
                            centerY = y + (cellH * 2) / 3;
                        }
                    } else {
                        // 半圓形/弧形塊
                        const arcDir = Math.floor(Math.random() * 2);
                        if (arcDir === 0) {
                            // 向上凸弧
                            pathD = `M ${x} ${y + cellH} L ${x} ${y + cellH/2} A ${cellW/2} ${cellH/2} 0 0 1 ${x + cellW} ${y + cellH/2} L ${x + cellW} ${y + cellH} Z`;
                        } else {
                            // 向下凸弧
                            pathD = `M ${x} ${y} L ${x + cellW} ${y} A ${cellW/2} ${cellH/2} 0 0 1 ${x} ${y} Z`;
                        }
                    }

                    regions.push({ path: pathD, cx: centerX, cy: centerY });
                }
            }
            return regions;
        }

        // 初始化/重新開始遊戲
        function initGame() {
            svg.innerHTML = '';
            selectedCount = 0;
            countDisplay.textContent = selectedCount;

            // 1. 生成 1-100 的隨機不重複數字陣列
            const numbers = Array.from({ length: 100 }, (_, i) => i + 1);
            shuffle(numbers);

            // 2. 生成 100 個隨機形狀區塊
            const regions = generateRegions();

            // 3. 繪製到 SVG 畫布
            regions.forEach((region, index) => {
                const num = numbers[index];

                // 建立 g (群組) 元素
                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');

                // 建立形狀 path
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', region.path);
                path.setAttribute('class', 'cell');
                path.setAttribute('fill', '#f8f9fa'); // 預設底色

                // 建立數字文字
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', region.cx);
                text.setAttribute('y', region.cy);
                text.setAttribute('class', 'cell-text');
                text.textContent = num;

                // 狀態記錄
                let isSelected = false;
                let assignedColor = '';

                // 點擊事件：切換選取狀態
                g.addEventListener('click', () => {
                    isSelected = !isSelected;

                    if (isSelected) {
                        assignedColor = getRandomColor();
                        path.setAttribute('fill', assignedColor);
                        text.classList.add('selected-text');
                        selectedCount++;
                    } else {
                        path.setAttribute('fill', '#f8f9fa');
                        text.classList.remove('selected-text');
                        selectedCount--;
                    }

                    countDisplay.textContent = selectedCount;

                    // 檢查是否全選完成
                    if (selectedCount === 100) {
                        setTimeout(() => alert('🎉 恭喜！你已經成功點選完所有的數字！'), 100);
                    }
                });

                g.appendChild(path);
                g.appendChild(text);
                svg.appendChild(g);
            });
        }

        // 事件監聽
        resetBtn.addEventListener('click', initGame);

        // 首次載入遊戲
        initGame();
    </script>
</body>
</html>
