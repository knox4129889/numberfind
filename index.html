<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幾何彩色玻璃找數字遊戲</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            margin-bottom: 15px;
            text-align: center;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #ffca28;
        }
        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }
        button {
            padding: 8px 18px;
            font-size: 1rem;
            font-weight: bold;
            color: #121212;
            background-color: #ffca28;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #ffb300;
        }
        button:active {
            transform: scale(0.98);
        }
        .stats {
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 6px;
        }
        /* 16:9 容器 */
        .game-wrapper {
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 16 / 9;
            position: relative;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            overflow: hidden;
        }
        svg {
            width: 100%;
            height: 100%;
            display: block;
            user-select: none;
        }
        .cell-path {
            cursor: pointer;
            stroke: #1a1a1a;
            stroke-width: 3;
            stroke-linejoin: round;
            fill: #ffffff;
            transition: fill 0.2s ease;
        }
        .cell-path:hover {
            opacity: 0.85;
        }
        .cell-text {
            font-size: 22px;
            font-weight: bold;
            fill: #1a1a1a;
            pointer-events: none;
            text-anchor: middle;
            dominant-baseline: central;
        }
        .selected-text {
            fill: #ffffff !important;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <header>
        <h1>幾何彩色玻璃找數字遊戲</h1>
        <div class="controls">
            <button id="resetBtn">重新洗牌數字</button>
            <div class="stats">已找到: <span id="count">0</span> / 100</div>
        </div>
    </header>

    <div class="game-wrapper">
        <svg id="gameSvg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet"></svg>
    </div>

    <script>
        const svg = document.getElementById('gameSvg');
        const resetBtn = document.getElementById('resetBtn');
        const countDisplay = document.getElementById('count');
        
        let selectedCount = 0;

        function getRandomColor() {
            const hue = Math.floor(Math.random() * 360);
            return `hsl(${hue}, 75%, 45%)`;
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 生成模擬圖片構圖的幾何分割數據（10x10 幾何複合陣列）
        function generateStainedGlassGrid() {
            const width = 1600;
            const height = 900;
            const cols = 10;
            const rows = 10;
            const w = width / cols;
            const h = height / rows;

            const cells = [];

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const x = c * w;
                    const y = r * h;
                    
                    // 多樣化幾何切割類型：矩形、對角斜切三角形、圓弧拱門風格
                    const styleType = (r + c) % 4;
                    let pathD = '';
                    let cx = x + w / 2;
                    let cy = y + h / 2;

                    if (styleType === 0) {
                        pathD = `M ${x} ${y} L ${x + w} ${y} L ${x + w} ${y + h} L ${x} ${y + h} Z`;
                    } else if (styleType === 1) {
                        pathD = `M ${x} ${y} L ${x + w} ${y} L ${x} ${y + h} Z`;
                        cx = x + w / 3;
                        cy = y + h / 3;
                    } else if (styleType === 2) {
                        pathD = `M ${x + w} ${y} L ${x + w} ${y + h} L ${x} ${y + h} Z`;
                        cx = x + (w * 2) / 3;
                        cy = y + (h * 2) / 3;
                    } else {
                        pathD = `M ${x} ${y + h} L ${x} ${y + h/2} A ${w/2} ${h/2} 0 0 1 ${x + w} ${y + h/2} L ${x + w} ${y + h} Z`;
                        cy = y + (h * 0.65);
                    }

                    cells.push({ path: pathD, cx: cx, cy: cy });
                }
            }
            return cells;
        }

        function renderGame() {
            svg.innerHTML = '';
            selectedCount = 0;
            countDisplay.textContent = selectedCount;

            const numbers = Array.from({ length: 100 }, (_, i) => i + 1);
            shuffle(numbers);

            const gridCells = generateStainedGlassGrid();

            gridCells.forEach((cell, i) => {
                const num = numbers[i];

                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');

                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', cell.path);
                path.setAttribute('class', 'cell-path');

                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', cell.cx);
                text.setAttribute('y', cell.cy);
                text.setAttribute('class', 'cell-text');
                text.textContent = num;

                let isSelected = false;

                g.addEventListener('click', () => {
                    isSelected = !isSelected;
                    if (isSelected) {
                        path.style.fill = getRandomColor();
                        text.classList.add('selected-text');
                        selectedCount++;
                    } else {
                        path.style.fill = '#ffffff';
                        text.classList.remove('selected-text');
                        selectedCount--;
                    }
                    countDisplay.textContent = selectedCount;

                    if (selectedCount === 100) {
                        setTimeout(() => alert('🎉 恭喜！你已點選完成所有 100 個數字！'), 100);
                    }
                });

                g.appendChild(path);
                g.appendChild(text);
                svg.appendChild(g);
            });
        }

        resetBtn.addEventListener('click', renderGame);
        renderGame();
    </script>
</body>
</html>
